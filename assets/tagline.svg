<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 40" width="700" height="40" role="img" aria-label="Rising from the ashes of every bug">
<defs>
  <style>@font-face { font-family: 'CT'; src: url(data:font/woff2;base64,) format('woff2'); }
    .t { font-family: 'CT', Georgia, serif; font-weight: 700; font-size: 20px; letter-spacing: 1px; fill: #FF6A00; }</style>
  <clipPath id="reveal"><rect x="0" y="0" width="0" height="40"><animate attributeName="width" from="0" to="700" begin="0.4s" dur="2.6s" fill="freeze"/></rect></clipPath>
</defs>
<text class="t" x="350" y="27" text-anchor="middle" clip-path="url(#reveal)">Rising from the ashes of every bug</text>
</svg>
